services:
  app:
    image: ghcr.io/kroqdotdev/stowage-app:${STOWAGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      NEXT_PUBLIC_POCKETBASE_URL: ${NEXT_PUBLIC_POCKETBASE_URL:-http://localhost:8090}
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD}
      STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # In-app updates (Settings > Updates). The app checks GitHub Releases
      # for new versions on its own; applying one needs the "updater"
      # profile below and the same token in both services.
      STOWAGE_UPDATER_URL: ${STOWAGE_UPDATER_URL:-http://updater:9876}
      STOWAGE_UPDATER_TOKEN: ${STOWAGE_UPDATER_TOKEN:-}
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-3000}:${APP_PORT:-3000}"

  pocketbase:
    profiles: ["pocketbase", "full"]
    image: ghcr.io/kroqdotdev/stowage-pocketbase:${STOWAGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD}
      POCKETBASE_DATA_DIR: /pb_data
    ports:
      - "${POCKETBASE_HOST_BIND:-127.0.0.1}:${POCKETBASE_HOST_PORT:-8090}:8090"
    volumes:
      - ${POCKETBASE_DATA_DIR:-./pb_data}:/pb_data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  caddy:
    profiles: ["full"]
    image: ghcr.io/kroqdotdev/stowage-caddy:${STOWAGE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      pocketbase:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_PORT: ${APP_PORT:-3000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # One-click updates from Settings > Updates. Opt in with
  # `--profile updater` (combine with the other profiles you use). The
  # sidecar needs the Docker socket to pull images and recreate the services
  # of this compose project, so only run it on a host you control. Set
  # STOWAGE_UPDATER_TOKEN to a long random string in .env.
  updater:
    profiles: ["updater"]
    image: ghcr.io/kroqdotdev/stowage-updater:${STOWAGE_VERSION:-latest}
    restart: unless-stopped
    environment:
      STOWAGE_UPDATER_TOKEN: ${STOWAGE_UPDATER_TOKEN:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater_state:/state

volumes:
  caddy_data:
  caddy_config:
  updater_state:
