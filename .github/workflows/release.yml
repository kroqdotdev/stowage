name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest (jsdom components)
        run: pnpm test

      - name: Download PocketBase binary
        run: pnpm pb:setup

      - name: Vitest (PocketBase domain)
        run: pnpm test:pb

  # Each image is built natively per platform: amd64 on the self-hosted
  # runner named by the CI_RUNNER repo variable (GitHub's when it is unset),
  # arm64 on GitHub's free arm runner. The platform builds push by digest and
  # the merge job joins them into one multi-arch tag, so no QEMU emulation is
  # needed anywhere. Layer caches live in GHCR next to the images.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, pocketbase, caddy, updater]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: app
            dockerfile: ./Dockerfile
          - image: pocketbase
            dockerfile: ./Dockerfile.pocketbase
          - image: caddy
            dockerfile: ./Dockerfile.caddy
          - image: updater
            dockerfile: ./Dockerfile.updater
          - platform: linux/amd64
            runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/stowage-${{ matrix.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Platform slug
        id: platform
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "slug=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ steps.platform.outputs.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ steps.platform.outputs.slug }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ steps.platform.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} manifest
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs:
      - verify
      - build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, pocketbase, caddy, updater]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/stowage-${{ matrix.image }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-arch manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify
      - publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Build release notes from changelog
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          CHANGELOG_SECTION="$(mktemp)"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {found=1; print; next}
            found && $0 ~ "^## \\[" {exit}
            found {print}
          ' CHANGELOG.md > "$CHANGELOG_SECTION"

          if [ ! -s "$CHANGELOG_SECTION" ]; then
            echo "CHANGELOG.md is missing a section for version $VERSION." >&2
            exit 1
          fi

          # Changelog first: Settings > Updates shows this body to admins.
          {
            cat "$CHANGELOG_SECTION"
            echo
            echo "## Docker images"
            echo
            echo "- \`ghcr.io/$OWNER/stowage-app:$VERSION\`"
            echo "- \`ghcr.io/$OWNER/stowage-pocketbase:$VERSION\`"
            echo "- \`ghcr.io/$OWNER/stowage-caddy:$VERSION\`"
            echo "- \`ghcr.io/$OWNER/stowage-updater:$VERSION\`"
            echo
            echo "## Deployment bundle"
            echo
            echo "- \`docker-compose.release.yml\`"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: |
            docker-compose.release.yml
            .env.example
